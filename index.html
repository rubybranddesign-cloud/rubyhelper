<!DOCTYPE html>
<html lang="zh-TW">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>特洛貳-AI智能小幫手</title>
<style>
  :root {
     
    --gx-blue: #3A7CB8;
    --gx-green: #A3C644;
    --gx-yellow: #E9D53D;
    --gx-purple: #623D8A;
    --border-light: #ececec;

    --primary-color: var(--gx-blue);
    --bg-color: #ffffff;
    --chat-bg: #ffffff;
    
     
    --client-msg-bg: #ffffff;
    --client-msg-border: #e0e0e0;
    --bot-msg-bg: #ffffff;
    --bot-msg-border: var(--gx-blue);
    --admin-msg-bg: #ffffff;
    --admin-msg-border: var(--gx-green);
    --warroom-msg-bg: #ffffff;
    --warroom-msg-border: var(--gx-purple);
    
    --text-dark: #2d2d2d;
  }

  body {
    margin: 0; padding: 0;
    font-family: 'PingFang TC', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif;
    background-color: var(--bg-color);
    overflow: hidden;
    letter-spacing: 0.5px;
  }


  #login-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: var(--bg-color);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000;
  }
 
  .login-box {
    background: #fff; padding: 40px; border-radius: 16px;
    border: 1px solid var(--border-light); width: 90%; max-width: 400px;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.03);
  }
 
  .login-box h2 { margin-top: 0; color: var(--gx-blue); font-size: 24px; font-weight: 500;}
  .login-box p { color: #888; margin-bottom: 24px; font-size: 14px;}
 
  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 15px;
    border: 1px solid var(--border-light); border-radius: 8px; font-size: 15px; box-sizing: border-box;
    outline: none; transition: all 0.3s; background-color: #fafafa;
  }
  .login-box input:focus { background-color: #fff; border-color: var(--gx-blue); }
 
  .login-box input:focus { border-color: var(--primary-color); }
 
  .login-box button {
    width: 100%; padding: 14px; background-color: var(--primary-color);
    color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: background 0.3s;
  }
 
  .login-box button:hover { background-color: #45a049; }
  .login-box button:disabled { background-color: #ccc; cursor: not-allowed; }
 
  #login-msg { margin-top: 10px; color: #d32f2f; font-size: 14px; min-height: 20px;}


  #tab-navbar {
    display: none;
    height: 50px;
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-light);
    z-index: 100;
    position: relative;
  }

  .tab-btn {
    flex: 1; background: transparent; border: none; font-size: 15px;
    font-weight: 500; color: #999; cursor: pointer; transition: all 0.3s ease;
    outline: none; display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .tab-btn.active {
    color: var(--gx-blue); border-bottom: 2px solid var(--gx-blue); background-color: #ffffff;
  }

  .tab-content {
    display: none; height: calc(100vh - 50px); width: 100vw;
  }

  .tab-content.active-tab { display: block; }

  #app-container { display: flex; height: 100%; width: 100%; }

  .sidebar {
    width: 320px; background: #fff; border-right: 1px solid var(--border-light);
    display: flex; flex-direction: column; transition: transform 0.3s ease;
  }

  .sidebar-header {
    background-color: #ffffff; color: var(--gx-blue); padding: 15px 20px;
    text-align: center; font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--border-light); z-index: 10;
  }

  .user-list { flex: 1; overflow-y: auto; background-color: #ffffff; }

  .user-item {
    padding: 18px 20px; border-bottom: 1px solid var(--border-light); cursor: pointer; font-size: 15px;
    color: var(--text-dark); display: flex; align-items: center; transition: all 0.2s;
  }

  .user-item:hover, .user-item.active {
    background-color: #fafafa; border-left: 3px solid var(--gx-blue);
  }

  .user-item.state-booked { background-color: #ffffff; border-left: 3px solid var(--gx-yellow); }
  .user-item.state-booked.active { background-color: #fafafa; }
  .user-item.state-completed { background-color: #ffffff; border-left: 3px solid var(--gx-green); }
  .user-item.state-completed.active { background-color: #fafafa; }


  .user-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold;}


  .count-badges { display: flex; gap: 6px; margin-left: 8px; align-items: center; }


  .badge {
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    font-weight: bold; padding: 3px 8px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }


  .badge-client { background-color: #dcf8c6; color: #2b5a10; }
  .badge-ai { background-color: #e3f2fd; color: #0d47a1; }
 
  .badge-urgent { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; animation: pulse 2s infinite; }
 
  .badge-label { background-color: #e0e0e0; color: #333; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; font-weight: normal;}


  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }


  .badge svg { width: 14px; height: 14px; margin-right: 4px; fill: currentColor; }


  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }


  .chat-header {
    background-color: #ffffff; color: var(--text-dark); padding: 15px 20px 15px 45px; text-align: left;
    font-size: 17px; font-weight: 500; border-bottom: 1px solid var(--border-light); z-index: 10;
    display: flex; align-items: center; justify-content: flex-start; position: relative;
  }

  .back-btn { display: none; position: absolute; left: 12px; font-size: 28px; cursor: pointer; line-height: 1; color: var(--gx-blue); }

  .logout-header-btn {
    position: absolute;
    right: 15px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-dark);
    background: #ffffff;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border-light);
    transition: all 0.3s;
  }
  .logout-header-btn:hover { background: #fafafa; border-color: #ccc; }

  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: #ffffff; scroll-behavior: smooth; }

  .msg-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
  }
  .msg-wrapper.right {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-wrapper.left {
    align-self: flex-start;
    flex-direction: row;
  }
  .msg-time {
    font-size: 11px;
    color: #bbb;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .date-divider {
    align-self: center;
    margin: 10px 0;
    width: 100%;
    text-align: center;
  }
  .date-divider span {
    background-color: transparent;
    color: #bbb;
    font-size: 12px;
    padding: 4px 12px;
    display: inline-block;
  }

  .msg-bubble {
    max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 15px;
    line-height: 1.5; word-wrap: break-word; position: relative; background-color: #ffffff; box-shadow: none;
  }

  .msg-client { border: 1px solid var(--client-msg-border); color: var(--text-dark); border-bottom-left-radius: 4px; }
  .msg-ai { border: 1px solid var(--bot-msg-border); color: var(--text-dark); border-bottom-right-radius: 4px; }
  .msg-admin { border: 1px solid var(--admin-msg-border); color: var(--text-dark); border-bottom-right-radius: 4px; }
  .msg-warroom { border: 1px solid var(--warroom-msg-border); color: var(--text-dark); border-bottom-left-radius: 4px; }
 
  .msg-pending { opacity: 0.8; animation: breathe 1.5s infinite ease-in-out; }
  @keyframes breathe { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

  .chat-input-area {
    display: flex; padding: 12px 15px; background: #fff; border-top: 1px solid var(--border-light);
    align-items: center; flex-wrap: wrap; gap: 8px 6px; padding-bottom: env(safe-area-inset-bottom, 12px);
  }

  .icon-btn {
    background: transparent; border: none; cursor: pointer; padding: 6px; display: flex;
    align-items: center; justify-content: center; border-radius: 50%; transition: all 0.3s;
    order: 2;
  }
  .icon-btn:hover { background-color: #fafafa; }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: #999; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s; }
  .icon-btn:hover svg { stroke: var(--gx-blue); }

  .chat-input {
    flex: 1 1 100%; order: 1; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: 12px; outline: none;
    font-size: 15px; margin: 0; resize: none; font-family: inherit; box-sizing: border-box;
    height: 55px; line-height: 1.4; overflow-y: auto; background-color: #fafafa; transition: all 0.3s;
  }
  .chat-input:focus { background-color: #fff; border-color: var(--gx-blue); box-shadow: 0 0 0 2px rgba(58,124,184,0.1); }

  .send-btn {
    background-color: #fff; color: var(--gx-blue); border: 1px solid var(--border-light); width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center;
    transition: all 0.3s; flex-shrink: 0; order: 2; margin-left: auto;
  }
  .send-btn:hover:not(:disabled) { background-color: var(--gx-blue); border-color: var(--gx-blue); }
  .send-btn:hover:not(:disabled) svg { stroke: #fff; }
  .send-btn:disabled { border-color: #eee; cursor: not-allowed; opacity: 0.6; }
  .send-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--gx-blue); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: all 0.3s; }

  .file-preview-area {
    display: none; padding: 8px 15px; background: #e8f5e9; font-size: 13px; color: #2b5a10;
    border-top: 1px solid #ddd;
  }
 
  .inline-error-msg {
    text-align: center;
    color: #d32f2f;
    font-size: 12px;
    margin: 10px 0;
    font-weight: bold;
  }


  @media (max-width: 768px) {
    .sidebar { width: 100%; position: absolute; z-index: 20; height: 100%; }
    .sidebar.hidden { transform: translateX(-100%); }
    .chat-area { width: 100%; height: 100%; }
    .back-btn { display: block; }
  }
</style>
</head>
<body>


<div id="login-overlay">
  <div class="login-box">
    <h2 id="login-title"></h2>
    <p>請輸入您的資訊以登入或開始對話</p>
    <input type="text" id="login-name" placeholder="您的稱呼 (如：王小明)">
    <input type="email" id="login-email" placeholder="您的 Email">
    <button id="login-btn" onclick="performLogin()">進入系統</button>
    <div id="login-msg"></div>
  </div>
</div>


<div id="tab-navbar">
  <button id="btn-admin" class="tab-btn active" onclick="switchTab('admin')">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
    監控
  </button>
  <button id="btn-client" class="tab-btn" onclick="switchTab('client')">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
    測試
  </button>
  <button id="btn-warroom" class="tab-btn" onclick="switchTab('warroom')">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    戰情
  </button>
  <button id="btn-logout" class="tab-btn" onclick="logout()" style="flex: 0.6; color: #d32f2f;">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    
  </button>
</div>


<div id="view-admin" class="tab-content">
  <div id="app-container">
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">系統監控台</div>
      <div id="user-list" class="user-list">
        <div style="padding: 20px; text-align: center; color: #888;">正在載入資料庫...</div>
      </div>
    </div>


    <div class="chat-area">
      <div class="chat-header">
        <span class="back-btn" onclick="backToList()">&#8249;</span>
        <span id="chat-title">請選擇左側客戶</span>
      </div>
     
      <div id="chat-messages" class="chat-messages">
          <div style="padding: 20px; text-align: center; color: #888; margin-top: 50px;">
            點擊左側列表客戶，即可開始監看或接管對話
          </div>
      </div>


      <div id="admin-file-preview" class="file-preview-area">
        📎 準備上傳檔案：<span class="file-name-display" style="font-weight: bold;"></span>
        <span onclick="clearSelectedFile()" style="margin-left: 15px; cursor: pointer; color: #d32f2f;">✖ 移除</span>
      </div>


      <div class="chat-input-area">
        <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="多媒體">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </button>
        <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="文件">
          <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </button>
        <button id="mic-btn" class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="語音">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>


        <textarea id="chat-input" class="chat-input" placeholder="輸入訊息強制接管... (Shift+Enter 換行)" onkeydown="handleKeyPress(event)"></textarea>
       
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>


<div id="view-client" class="tab-content">
  <div class="chat-area" style="height: 100%;">
    <div class="chat-header">
      <span id="client-chat-title">網頁客戶端 (資料同步記錄至雲端)</span>
      <span class="logout-header-btn" onclick="logout()">登出</span>
    </div>
   
    <div id="client-chat-messages" class="chat-messages">
       <div style="padding: 20px; text-align: center; color: #888; margin-top: 50px;">
         歡迎進入。請直接發送訊息，系統會為您提供專屬智能服務。
       </div>
    </div>


    <div id="client-file-preview" class="file-preview-area">
      📎 準備上傳檔案：<span class="file-name-display" style="font-weight: bold;"></span>
      <span onclick="clearSelectedFile()" style="margin-left: 15px; cursor: pointer; color: #d32f2f;">✖ 移除</span>
    </div>


    <div class="chat-input-area">
      <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="多媒體">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>
      <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="文件">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </button>
      <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="語音">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>


      <textarea id="client-chat-input" class="chat-input" placeholder="請輸入訊息... (Shift+Enter 換行)" onkeydown="handleClientKeyPress(event)"></textarea>
     
      <button id="client-send-btn" class="send-btn" onclick="sendClientMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>


<div id="view-warroom" class="tab-content">
  <div class="chat-area" style="height: 100%;">
    <div class="chat-header">
      <span id="warroom-chat-title">老闆戰情室 - 麥肯錫高階戰略顧問</span>
    </div>
   
    <div id="warroom-chat-messages" class="chat-messages">
       <div style="padding: 20px; text-align: center; color: #888; margin-top: 50px;">
         歡迎來到企業戰情室。<br><br>系統大腦已準備就緒，您可以隨時請我分析「客戶管理」、「收支記帳」或提供高商業價值的決策建議。
       </div>
    </div>


    <div id="warroom-file-preview" class="file-preview-area">
      📎 準備上傳檔案：<span class="file-name-display" style="font-weight: bold;"></span>
      <span onclick="clearSelectedFile()" style="margin-left: 15px; cursor: pointer; color: #d32f2f;">✖ 移除</span>
    </div>


    <div class="chat-input-area">
      <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="多媒體">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>
      <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="文件">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </button>
      <button class="icon-btn" onclick="document.getElementById('global-file-upload').click()" title="語音">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>


      <textarea id="warroom-chat-input" class="chat-input" placeholder="輸入您的指令或提問，進行深層戰略分析... (Shift+Enter 換行)" onkeydown="handleWarRoomKeyPress(event)"></textarea>
     
      <button id="warroom-send-btn" class="send-btn" onclick="sendWarRoomMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>


<input type="file" id="global-file-upload" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;" onchange="handleFileUpload(event)">


<script>
  
  const GAS_WEB_URL = "https://script.google.com/macros/s/AKfycbxEwypg0437DP1T3jJrDAcGK4Zz2xAk6lCflHzZ51lfLjkd9QbdfTEs_2--5fb-9dH7/exec";
  const GAS_URL = GAS_WEB_URL;


  
  function requestBackend(payload) {
    if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.serverDispatcher === 'function') {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.status === 'success' && typeof res.data !== 'undefined') {
              resolve(res.data);
            } else {
              resolve(res);
            }
          })
          .withFailureHandler(err => reject(err))
          .serverDispatcher(payload);
      });
    } else {
      return fetch(GAS_WEB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(res => {
        if (res && res.status === 'success' && typeof res.data !== 'undefined') {
          return res.data;
        }
        return res;
      });
    }
  }


  const adminIcon = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
  const advisorIcon = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 4px;"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;


  // 全局變數
  let systemBotName = "智能客服";
  let pendingFileObj = null;
  let lastClientDate = "";
  let lastAdminDate = "";
  let lastWarRoomDate = "";


  
  let clientPendingCount = 0;
  let warroomPendingCount = 0;
  let clientThinkingTimer = null;
  let warroomThinkingTimer = null;


  function displayErrorInChat(containerId, errorMsg) {
    const msgContainer = document.getElementById(containerId);
    const errDiv = document.createElement('div');
    errDiv.className = 'inline-error-msg';
    errDiv.innerHTML = `⚠️ ${errorMsg}`;
    msgContainer.appendChild(errDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }


  function logout() {
    localStorage.removeItem('growthx_user_email');
    localStorage.removeItem('growthx_user_name');
    localStorage.removeItem('growthx_user_role');
   
    if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
    }


    currentUserEmail = "";
    currentUserName = "";
    currentUserRole = "";
    selectedUserId = null;
    selectedUserRowId = null;
    localChatCache = {};
    localUserCache = [];


    document.getElementById('login-msg').innerText = "";
    document.getElementById('login-name').value = "";
    document.getElementById('login-email').value = "";
    document.getElementById('login-overlay').style.display = 'flex';
   
    document.getElementById('tab-navbar').style.display = 'none';
    document.querySelectorAll('.tab-content').forEach(view => view.classList.remove('active-tab'));
  }


  window.onload = function() {
    requestBackend({ action: 'get_sys_config' })
    .then(data => {
        if (data && data.botName) {
            systemBotName = data.botName;
            document.title = systemBotName + " 企業助理與戰略系統";
            document.getElementById('login-title').innerText = systemBotName + "";
            document.getElementById('client-chat-title').innerText = systemBotName;
        }
    })
    .catch(err => console.error("系統參數載入失敗", err));


    const savedEmail = localStorage.getItem('growthx_user_email');
    const savedName = localStorage.getItem('growthx_user_name');
    const savedRole = localStorage.getItem('growthx_user_role');


    if (savedEmail && savedName && savedRole) {
        currentUserEmail = savedEmail;
        currentUserName = savedName;
        currentUserRole = savedRole;
        document.getElementById('login-overlay').style.display = 'none';


        if(currentUserRole === 'boss') {
          document.getElementById('tab-navbar').style.display = 'flex';
          switchTab('admin');
          fetchDataBundle(false);
          pollingInterval = setInterval(() => { fetchDataBundle(true); }, 5000);
        } else {
          document.getElementById('tab-navbar').style.display = 'none';
          document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
          document.getElementById('view-client').classList.add('active-tab');
          document.getElementById('client-chat-title').innerText = systemBotName;
          loadClientHistory(currentUserEmail);
        }
    }
  };


  function processMessageContent(rawText) {
    if (!rawText) rawText = "";
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
   
    let msgDate = `${yyyy}-${mm}-${dd}`;
    let msgTime = `${hh}:${min}`;
    let cleanText = rawText;
   
    const timeMatch = rawText.match(/\[(\d{4}-\d{2}-\d{2})\s(\d{2}:\d{2}):\d{2}\]/);
    if (timeMatch) {
        msgDate = timeMatch[1];
        msgTime = timeMatch[2];
        cleanText = rawText.replace(/\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\]/g, '');
    }
    return { date: msgDate, time: msgTime, text: cleanText };
  }


  function stripMarkdown(text) {
    if (!text) return "";
    return text.replace(/\*\*(.*?)\*\*/g, '$1')
               .replace(/\*(.*?)\*/g, '$1')
               .replace(/#{1,6}\s?/g, '')
               .replace(/`/g, '')
               .replace(/\n/g, '<br>');
  }


  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;


    document.querySelectorAll('.file-preview-area').forEach(el => el.style.display = 'block');
    document.querySelectorAll('.file-name-display').forEach(el => el.innerText = file.name);


    const reader = new FileReader();
    reader.onload = function(e) {
      pendingFileObj = {
        fileName: file.name,
        mimeType: file.type,
        base64: e.target.result.split(',')[1]
      };
    };
    reader.readAsDataURL(file);
  }


  function clearSelectedFile() {
    pendingFileObj = null;
    document.getElementById('global-file-upload').value = "";
    document.querySelectorAll('.file-preview-area').forEach(el => el.style.display = 'none');
  }
 
  let currentUserEmail = "";
  let currentUserName = "";
  let currentUserRole = "";


  function performLogin() {
    const name = document.getElementById('login-name').value.trim();
    const email = document.getElementById('login-email').value.trim();
    const msgEl = document.getElementById('login-msg');


    if(!name || !email) {
      msgEl.innerText = "請完整填寫稱呼與 Email。";
      return;
    }
    if(!email.includes('@')) {
      msgEl.innerText = "請輸入有效的 Email 格式。";
      return;
    }


    msgEl.innerText = "驗證中，請稍候...";
    document.getElementById('login-btn').disabled = true;


    requestBackend({ action: 'verify_login', email: email, name: name })
    .then(res => {
        currentUserEmail = res.email;
        currentUserName = res.name;
        currentUserRole = res.role;


        localStorage.setItem('growthx_user_email', currentUserEmail);
        localStorage.setItem('growthx_user_name', currentUserName);
        localStorage.setItem('growthx_user_role', currentUserRole);


        document.getElementById('login-overlay').style.display = 'none';


        if(currentUserRole === 'boss') {
          document.getElementById('tab-navbar').style.display = 'flex';
          switchTab('admin');
          fetchDataBundle(false);
          pollingInterval = setInterval(() => { fetchDataBundle(true); }, 5000);
        } else {
          document.getElementById('tab-navbar').style.display = 'none';
          document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
          document.getElementById('view-client').classList.add('active-tab');
          document.getElementById('client-chat-title').innerText = systemBotName;
          loadClientHistory(currentUserEmail);
        }
       
        document.getElementById('login-btn').disabled = false;
        msgEl.innerText = "";
    })
    .catch(err => {
        msgEl.innerText = "系統連線異常，請稍後再試。";
        document.getElementById('login-btn').disabled = false;
        console.error(err);
    });
  }


  function loadClientHistory(email) {
    requestBackend({ action: 'get_admin_data' })
    .then(bundle => {
        const history = (bundle.histories && bundle.histories[email]) ? bundle.histories[email] : [];
        const msgContainer = document.getElementById('client-chat-messages');
        msgContainer.innerHTML = '';
        lastClientDate = "";
       
        if(history.length === 0) {
            msgContainer.innerHTML = `<div style="padding: 20px; text-align: center; color: #888; margin-top: 50px;">歡迎！請直接發送訊息，${systemBotName}會為您提供服務。</div>`;
            return;
        }
       
        history.forEach(msg => {
            const timeData = processMessageContent(msg.text);
            if (timeData.date !== lastClientDate) {
                const dateDiv = document.createElement('div');
                dateDiv.className = 'date-divider';
                dateDiv.innerHTML = `<span>${timeData.date}</span>`;
                msgContainer.appendChild(dateDiv);
                lastClientDate = timeData.date;
            }


            const wrapper = document.createElement('div');
            const isRight = (msg.sender === 'ai');
            wrapper.className = 'msg-wrapper ' + (isRight ? 'right' : 'left');


            const bubble = document.createElement('div');
            bubble.classList.add('msg-bubble');
            if(msg.sender === 'client') {
                bubble.classList.add('msg-client');
            } else {
                bubble.classList.add('msg-ai');
            }
            bubble.innerHTML = stripMarkdown(timeData.text).replace(/\[真人客服\]/g, '');
           
            const timeDiv = document.createElement('div');
            timeDiv.className = 'msg-time';
            timeDiv.innerText = timeData.time;


            wrapper.appendChild(bubble);
            wrapper.appendChild(timeDiv);
            msgContainer.appendChild(wrapper);
        });
        clientScrollToBottom();
    })
    .catch(err => console.error(err));
  }


  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(view => view.classList.remove('active-tab'));
   
    document.getElementById('btn-' + tabId).classList.add('active');
    document.getElementById('view-' + tabId).classList.add('active-tab');
  }


  let selectedUserId = null;
  let selectedUserRowId = null;
  let pollingInterval = null;
  let pendingRequests = 0;
  let localChatCache = {};
  let localUserCache = [];
  let readHistoryLength = {};


  function fetchDataBundle(isSilent) {
    requestBackend({ action: 'get_admin_data' })
    .then(bundle => handleDataBundle(bundle, isSilent))
    .catch(err => console.error("資料獲取失敗:", err));
  }


  function handleDataBundle(bundle, isSilent) {
    localUserCache = bundle.users || [];
    const histories = bundle.histories || {};
   
    if (pendingRequests > 0 && selectedUserId) {
        Object.keys(histories).forEach(uid => {
          if (uid !== selectedUserId) {
            localChatCache[uid] = histories[uid];
          }
        });
    } else {
        const prevStr = JSON.stringify(localChatCache[selectedUserId] || []);
        const newStr = JSON.stringify(histories[selectedUserId] || []);
       
        localChatCache = histories;


        if (selectedUserId) {
          readHistoryLength[selectedUserId] = (localChatCache[selectedUserId] || []).length;
         
          if (isSilent && prevStr === newStr) {
              renderUserList();
              return;
          }
          renderChatHistory(localChatCache[selectedUserId] || []);
        }
    }
   
    renderUserList();
  }


  function renderUserList() {
    const listEl = document.getElementById('user-list');
    const uniqueUsers = [];
    const seenIds = new Set();
    localUserCache.forEach(u => {
      if (!seenIds.has(u.userId)) {
        seenIds.add(u.userId);
        uniqueUsers.push(u);
      }
    });


    if(uniqueUsers.length === 0) {
        listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">目前尚無客戶紀錄</div>';
        return;
    }
   
    listEl.innerHTML = '';
    uniqueUsers.forEach(u => {
      let userClass = 'user-item';
      if (u.userId === selectedUserId) userClass += ' active';
      if (u.bookingState === 'booked') userClass += ' state-booked';
      else if (u.bookingState === 'completed') userClass += ' state-completed';


      const item = document.createElement('div');
      item.className = userClass;
     
      let clientCount = 0;
      let aiCount = 0;
      const history = localChatCache[u.userId] || [];
      const readLen = readHistoryLength[u.userId] || 0;
     
      for (let i = readLen; i < history.length; i++) {
        const msg = history[i];
        if (msg.text.includes("[系統動態觸裝追蹤提醒]") || msg.text.includes("[系統紀錄：")) continue;
       
        if (msg.sender === 'client') {
            clientCount++;
        } else if (msg.sender === 'ai') {
            aiCount++;
        }
      }


      const infoCol = document.createElement('div');
      infoCol.style.flex = '1';
      infoCol.style.overflow = 'hidden';
      infoCol.style.display = 'flex';
      infoCol.style.flexDirection = 'column';
      infoCol.style.justifyContent = 'center';


      const nameSpan = document.createElement('span');
      nameSpan.className = 'user-name';
      nameSpan.innerText = u.userName || u.userId;
      infoCol.appendChild(nameSpan);


      if (u.labels && u.labels.length > 0) {
        const labelsDiv = document.createElement('div');
        labelsDiv.style.display = 'flex';
        labelsDiv.style.gap = '4px';
        labelsDiv.style.marginTop = '4px';
        labelsDiv.style.overflow = 'hidden';
        labelsDiv.style.wrap = 'nowrap';
        u.labels.forEach(lbl => {
            const lSpan = document.createElement('span');
            lSpan.className = 'badge-label';
            lSpan.innerText = lbl;
            labelsDiv.appendChild(lSpan);
        });
        infoCol.appendChild(labelsDiv);
      }
     
      const badgesDiv = document.createElement('div');
      badgesDiv.className = 'count-badges';
     
      if (u.isUrgent) {
        const urgentBadge = document.createElement('div');
        urgentBadge.className = 'badge-urgent badge';
        urgentBadge.title = "超過24小時未回覆";
        urgentBadge.innerText = "急";
        badgesDiv.appendChild(urgentBadge);
      }


      if (clientCount > 0) {
        const clientBadge = document.createElement('div');
        clientBadge.className = 'badge badge-client';
        clientBadge.title = "客戶新訊息量";
        clientBadge.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg> ${clientCount}`;
        badgesDiv.appendChild(clientBadge);
      }
     
      if (aiCount > 0) {
        const aiBadge = document.createElement('div');
        aiBadge.className = 'badge badge-ai';
        aiBadge.title = "AI新回覆量";
        aiBadge.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg> ${aiCount}`;
        badgesDiv.appendChild(aiBadge);
      }


      item.appendChild(infoCol);
      item.appendChild(badgesDiv);


      item.onclick = () => selectUser(u.userId, u.userName || u.userId, u._rowId);
      listEl.appendChild(item);
    });
  }


  function selectUser(userId, userName, rowId) {
    selectedUserId = userId;
    selectedUserRowId = rowId || null;
    pendingRequests = 0;
    readHistoryLength[userId] = (localChatCache[userId] || []).length;
    document.getElementById('chat-title').innerText = userName + " 的對話";
   
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('hidden');
    }
   
    renderChatHistory(localChatCache[userId] || []);
    renderUserList();
  }


  function backToList() {
    document.getElementById('sidebar').classList.remove('hidden');
  }


  function renderChatHistory(history) {
    const msgContainer = document.getElementById('chat-messages');
    const isAtBottom = msgContainer.scrollHeight - msgContainer.scrollTop <= msgContainer.clientHeight + 80;
   
    msgContainer.innerHTML = '';
    lastAdminDate = "";


    if(history.length === 0) {
        msgContainer.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px;">尚無對話紀錄</div>';
        return;
    }


    history.forEach(msg => {
      const timeData = processMessageContent(msg.text);
      if (timeData.date !== lastAdminDate) {
          const dateDiv = document.createElement('div');
          dateDiv.className = 'date-divider';
          dateDiv.innerHTML = `<span>${timeData.date}</span>`;
          msgContainer.appendChild(dateDiv);
          lastAdminDate = timeData.date;
      }


      const isRight = (msg.sender === 'ai' || msg.sender === 'admin');
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper ' + (isRight ? 'right' : 'left');


      const bubble = document.createElement('div');
      bubble.classList.add('msg-bubble');
     
      if (msg.sender === 'client') {
        bubble.classList.add('msg-client');
      } else if (msg.sender === 'ai') {
        bubble.classList.add('msg-ai');
      } else {
        bubble.classList.add('msg-admin');
      }
     
      let formattedText = stripMarkdown(timeData.text);
      formattedText = formattedText.replace(/\[真人客服\]/g, `<strong>${adminIcon}真人接管回覆：</strong><br>`);
     
      bubble.innerHTML = formattedText;
     
      const timeDiv = document.createElement('div');
      timeDiv.className = 'msg-time';
      timeDiv.innerText = timeData.time;


      wrapper.appendChild(bubble);
      wrapper.appendChild(timeDiv);
      msgContainer.appendChild(wrapper);
    });


    if(isAtBottom) scrollToBottom();
  }


  function handleKeyPress(event) {
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }


  function sendMessage() {
    if (!selectedUserId) return;


    const inputEl = document.getElementById('chat-input');
    const text = inputEl.value.trim();
   
    if (!text && !pendingFileObj) return;


    const msgContainer = document.getElementById('chat-messages');
   
    const timeData = processMessageContent("");
    if (timeData.date !== lastAdminDate) {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'date-divider';
        dateDiv.innerHTML = `<span>${timeData.date}</span>`;
        msgContainer.appendChild(dateDiv);
        lastAdminDate = timeData.date;
    }


    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper right';


    const bubble = document.createElement('div');
    bubble.classList.add('msg-bubble', 'msg-admin');
   
    let displayMsg = text || "[傳送了檔案給客戶]";
    if (pendingFileObj) displayMsg += `<br><i>📎 [附加檔案：${pendingFileObj.fileName}]</i>`;


    bubble.innerHTML = `<strong>${adminIcon}真人接管回覆：</strong><br>` + stripMarkdown(displayMsg);
   
    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.innerText = timeData.time;


    wrapper.appendChild(bubble);
    wrapper.appendChild(timeDiv);
    msgContainer.appendChild(wrapper);
   
    scrollToBottom();
   
    if (!localChatCache[selectedUserId]) localChatCache[selectedUserId] = [];
    localChatCache[selectedUserId].push({ sender: 'admin', text: displayMsg });
    readHistoryLength[selectedUserId] = localChatCache[selectedUserId].length;


    const payload = {
       action: 'send_admin_override',
       userId: selectedUserId,
       _rowId: selectedUserRowId,
       text: displayMsg
    };


    inputEl.value = "";
    inputEl.focus();
    clearSelectedFile();


    pendingRequests++;


    requestBackend(payload)
    .then(res => {
        pendingRequests--;
        if(pendingRequests === 0) fetchDataBundle(true);
    })
    .catch(err => {
        pendingRequests--;
        displayErrorInChat('chat-messages', '接管送出異常，請確認網路狀態。');
        console.error(err);
    });
  }


  function scrollToBottom() {
    const msgContainer = document.getElementById('chat-messages');
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }


  // 客戶端發送與防抖邏輯
  function handleClientKeyPress(event) {
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendClientMessage();
    }
  }


  function sendClientMessage() {
    const inputEl = document.getElementById('client-chat-input');
    const text = inputEl.value.trim();
   
    if (!text && !pendingFileObj) return;


    const msgContainer = document.getElementById('client-chat-messages');
    const timeData = processMessageContent("");
    if (timeData.date !== lastClientDate) {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'date-divider';
        dateDiv.innerHTML = `<span>${timeData.date}</span>`;
        msgContainer.appendChild(dateDiv);
        lastClientDate = timeData.date;
    }


    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper left';


    const bubble = document.createElement('div');
    bubble.classList.add('msg-bubble', 'msg-client');
   
    let displayMsg = text;
    if (pendingFileObj) displayMsg += (text ? `<br>` : "") + `<i>📎 [已附加檔案：${pendingFileObj.fileName}]</i>`;
   
    bubble.innerHTML = stripMarkdown(displayMsg);
   
    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.innerText = timeData.time;


    wrapper.appendChild(bubble);
    wrapper.appendChild(timeDiv);
    msgContainer.appendChild(wrapper);
    clientScrollToBottom();
   
    const payload = {
      action: 'client_chat',
      email: currentUserEmail,
      name: currentUserName,
      text: text || `[用戶傳送了多媒體/檔案：${pendingFileObj.fileName}]`,
      fileObj: pendingFileObj
    };


    inputEl.value = "";
    clearSelectedFile();
    inputEl.focus();


    clientPendingCount++;


    clearTimeout(clientThinkingTimer);
    clientThinkingTimer = setTimeout(() => {
        let pendingWrapper = document.getElementById('client-pending-wrapper');
        if (!pendingWrapper && clientPendingCount > 0) {
            pendingWrapper = document.createElement('div');
            pendingWrapper.className = 'msg-wrapper right';
            pendingWrapper.id = 'client-pending-wrapper';


            const pendingBubble = document.createElement('div');
            pendingBubble.classList.add('msg-bubble', 'msg-ai', 'msg-pending');
            pendingBubble.innerHTML = 'AI 正在思考與解析內容中...';
           
            const pendingTime = document.createElement('div');
            pendingTime.className = 'msg-time';
            pendingTime.innerText = processMessageContent("").time;


            pendingWrapper.appendChild(pendingBubble);
            pendingWrapper.appendChild(pendingTime);
            msgContainer.appendChild(pendingWrapper);
            clientScrollToBottom();
        }
    }, 2000);


    requestBackend(payload)
    .then(data => {
        clientPendingCount--;
       
        if (data && data.isSilent) return;


        clearTimeout(clientThinkingTimer);
        const loadingEl = document.getElementById('client-pending-wrapper');
        if (loadingEl) loadingEl.remove();


        const replyTimeData = processMessageContent((data && data.reply) ? data.reply : "");
        if (replyTimeData.date !== lastClientDate) {
            const dateDiv = document.createElement('div');
            dateDiv.className = 'date-divider';
            dateDiv.innerHTML = `<span>${replyTimeData.date}</span>`;
            msgContainer.appendChild(dateDiv);
            lastClientDate = replyTimeData.date;
        }


        const repWrapper = document.createElement('div');
        repWrapper.className = 'msg-wrapper right';


        const aiBubble = document.createElement('div');
        aiBubble.classList.add('msg-bubble', 'msg-ai');
        aiBubble.innerHTML = stripMarkdown(replyTimeData.text);
       
        const repTime = document.createElement('div');
        repTime.className = 'msg-time';
        repTime.innerText = replyTimeData.time;


        repWrapper.appendChild(aiBubble);
        repWrapper.appendChild(repTime);
        msgContainer.appendChild(repWrapper);
       
        clientScrollToBottom();
        if(currentUserRole === 'boss') fetchDataBundle(true);
    })
    .catch(err => {
        clientPendingCount--;
        if (clientPendingCount === 0) {
            const loadingEl = document.getElementById('client-pending-wrapper');
            if (loadingEl) loadingEl.remove();
            displayErrorInChat('client-chat-messages', '發送失敗，請確認網路狀態。');
        }
        console.error(err);
    });
  }


  function clientScrollToBottom() {
    const msgContainer = document.getElementById('client-chat-messages');
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }


  // 老闆戰情室邏輯
  function handleWarRoomKeyPress(event) {
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendWarRoomMessage();
    }
  }


  function sendWarRoomMessage() {
    const inputEl = document.getElementById('warroom-chat-input');
    const text = inputEl.value.trim();
   
    if (!text && !pendingFileObj) return;


    const msgContainer = document.getElementById('warroom-chat-messages');
    const timeData = processMessageContent("");
    if (timeData.date !== lastWarRoomDate) {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'date-divider';
        dateDiv.innerHTML = `<span>${timeData.date}</span>`;
        msgContainer.appendChild(dateDiv);
        lastWarRoomDate = timeData.date;
    }


    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper right';


    const userBubble = document.createElement('div');
    userBubble.classList.add('msg-bubble', 'msg-admin');
   
    let displayMsg = text;
    if (pendingFileObj) displayMsg += (text ? `<br>` : "") + `<i>📎 [已附加檔案：${pendingFileObj.fileName}]</i>`;
   
    userBubble.innerHTML = stripMarkdown(displayMsg);
   
    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.innerText = timeData.time;


    wrapper.appendChild(userBubble);
    wrapper.appendChild(timeDiv);
    msgContainer.appendChild(wrapper);
    warRoomScrollToBottom();


    const payload = {
      action: 'war_room_chat',
      userMessage: text || `[老闆傳送了圖片/檔案：${pendingFileObj.fileName}]`,
      fileObj: pendingFileObj
    };


    inputEl.value = "";
    clearSelectedFile();
    inputEl.focus();


    warroomPendingCount++;


    clearTimeout(warroomThinkingTimer);
    warroomThinkingTimer = setTimeout(() => {
        let pendingWrapper = document.getElementById('warroom-pending-wrapper');
        if (!pendingWrapper && warroomPendingCount > 0) {
            pendingWrapper = document.createElement('div');
            pendingWrapper.className = 'msg-wrapper left';
            pendingWrapper.id = 'warroom-pending-wrapper';


            const pendingBubble = document.createElement('div');
            pendingBubble.classList.add('msg-bubble', 'msg-warroom', 'msg-pending');
            pendingBubble.innerHTML = '戰情室核心正在分析龐大資料與運算決策...';
           
            const pendingTime = document.createElement('div');
            pendingTime.className = 'msg-time';
            pendingTime.innerText = processMessageContent("").time;


            pendingWrapper.appendChild(pendingBubble);
            pendingWrapper.appendChild(pendingTime);
            msgContainer.appendChild(pendingWrapper);
            warRoomScrollToBottom();
        }
    }, 2000);


    requestBackend(payload)
    .then(data => {
        warroomPendingCount--;
       
        if (data && data.isSilent) return;


        clearTimeout(warroomThinkingTimer);
        const loadingEl = document.getElementById('warroom-pending-wrapper');
        if (loadingEl) loadingEl.remove();


        const replyTimeData = processMessageContent((data && data.reply) ? data.reply : "");
        if (replyTimeData.date !== lastWarRoomDate) {
            const dateDiv = document.createElement('div');
            dateDiv.className = 'date-divider';
            dateDiv.innerHTML = `<span>${replyTimeData.date}</span>`;
            msgContainer.appendChild(dateDiv);
            lastWarRoomDate = replyTimeData.date;
        }


        const repWrapper = document.createElement('div');
        repWrapper.className = 'msg-wrapper left';


        const aiBubble = document.createElement('div');
        aiBubble.classList.add('msg-bubble', 'msg-warroom');
        aiBubble.innerHTML = `<strong>${advisorIcon}戰情顧問：</strong><br>` + stripMarkdown(replyTimeData.text);
       
        const repTime = document.createElement('div');
        repTime.className = 'msg-time';
        repTime.innerText = replyTimeData.time;


        repWrapper.appendChild(aiBubble);
        repWrapper.appendChild(repTime);
        msgContainer.appendChild(repWrapper);
       
        warRoomScrollToBottom();
    })
    .catch(err => {
        warroomPendingCount--;
        if (warroomPendingCount === 0) {
            const loadingEl = document.getElementById('warroom-pending-wrapper');
            if (loadingEl) loadingEl.remove();
            displayErrorInChat('warroom-chat-messages', '戰情室連線失敗，請檢查網路！');
        }
        console.error(err);
    });
  }


  function warRoomScrollToBottom() {
    const msgContainer = document.getElementById('warroom-chat-messages');
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }
  
  // 自動將現有 SVG 替換為極簡質感線條圖標 (Feather Icons)
  document.addEventListener('DOMContentLoaded', () => {
    const setLineIcon = (selector, pathHtml) => {
      document.querySelectorAll(selector).forEach(el => {
        el.innerHTML = pathHtml;
        el.setAttribute('viewBox', '0 0 24 24');
      });
    };
    // 附件/多媒體/語音/發送 等替換為極簡線條
    setLineIcon('.icon-btn[title="多媒體"] svg', '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>');
    setLineIcon('.icon-btn[title="文件"] svg', '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline>');
    setLineIcon('.icon-btn[title="語音"] svg', '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>');
    setLineIcon('.send-btn svg', '<line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>');
  });
</script>
